<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Opening email…</title>
        <style>
            body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                margin: 0;
                background: #fafafa;
                color: #333;
            }
            .box { text-align: center; padding: 1.5rem; }
            a { color: #2563eb; }
     
            @media (prefers-color-scheme: dark) {
                body { background: #1a1a1a; color: #eee; }
                a { color: #60a5fa; }
            }
        </style>
    </head>
    <body>
        <p class="box">Opening email… <a id="link" href="#">click here if nothing happens</a></p>
        <script>
            var params = new URLSearchParams(window.location.search);
            var to = params.get("to") || "";
            var subject = params.get("subject") || "";
            var body = params.get("body") || "";

            var mailto = "mailto:" + to;
            var query = [];
            if (subject) query.push("subject=" + encodeURIComponent(subject));
            if (body) query.push("body=" + encodeURIComponent(body));
            if (query.length) mailto += "?" + query.join("&");

            document.getElementById("link").href = mailto;
            window.location.href = mailto;
        </script>
    </body>
</html>
